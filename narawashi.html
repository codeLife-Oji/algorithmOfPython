<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ならわし帳</title>
<style>
:root{
  --ground:#F3F5F1; --surface:#FFFFFF; --sunk:#E8ECE6; --line:#D7DDD4;
  --ink:#1B211E; --muted:#66706A; --accent:#2E6B58; --accent-ink:#FFFFFF;
  --today:#C2512F; --future:#A9B2AC;
  --yt:#C4302B;
  --aw:#3B6FB6; --ex:#C9772B; --pos:#2E7D4F; --neg:#B6452C;
  --h0:#2E8A6E; --h1:#3B6FB6; --h2:#C9772B; --h3:#A94B7C; --h4:#6B5BB8; --h5:#8A8F2E; --h6:#C0453F; --h7:#2F8FA3;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#101412; --surface:#191E1B; --sunk:#232A26; --line:#2E3632;
    --ink:#E5EAE6; --muted:#98A29C; --accent:#6CC0A5; --accent-ink:#0E1512;
    --today:#F08A66; --future:#4C5550;
    --aw:#5E8FD6; --ex:#C4803C; --pos:#6CC08A; --neg:#F08A66;
    --yt:#F0736B; --h0:#56BD9C; --h1:#6D9EE3; --h2:#E6A05A; --h3:#D97CAC; --h4:#9A8CE6; --h5:#B9BE58; --h6:#EC7771; --h7:#5BBBD0;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#101412; --surface:#191E1B; --sunk:#232A26; --line:#2E3632;
  --ink:#E5EAE6; --muted:#98A29C; --accent:#6CC0A5; --accent-ink:#0E1512;
  --today:#F08A66; --future:#4C5550;
  --aw:#5E8FD6; --ex:#C4803C; --pos:#6CC08A; --neg:#F08A66;
  --yt:#F0736B; --h0:#56BD9C; --h1:#6D9EE3; --h2:#E6A05A; --h3:#D97CAC; --h4:#9A8CE6; --h5:#B9BE58; --h6:#EC7771; --h7:#5BBBD0;
}
*{box-sizing:border-box}
html,body{height:100%}
/* 画面の高さに固定し、中身だけをスクロールさせる（下のタブを常に見せるため） */
body{display:flex;flex-direction:column;overflow:hidden}
.scroller{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
body{background:var(--ground);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:10px 24px}
header.top{display:flex;align-items:center;gap:12px}
header.top:has(> :not([hidden]):not(:empty)){padding-block:6px 10px}
.brand{font-weight:700;font-size:15px;letter-spacing:.04em}
.sync{font-size:12px;color:var(--muted);margin-left:auto;display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--future);display:inline-block}
.sync.ok i{background:var(--accent)}

.cols{display:grid;gap:20px}
section.pane{min-width:0}

/* ---- 記録 ---- */
.daynav{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.daynav .date{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.daynav .md{font-size:17px;font-weight:700;line-height:1.3}
.daynav .md small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.daynav .rel{font-size:12px;color:var(--muted)}
.daynav .iconbtn{width:34px;height:34px;border-radius:10px;font-size:16px}
.daynav .rel.is-today{color:var(--today);font-weight:600}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:18px}
.pill{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}

.progress{display:flex;align-items:baseline;gap:10px;margin:4px 0 12px}
.progress b{font-size:15px}
.bar{flex:1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;align-self:center}
.bar > span{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}

.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 14px 16px;min-height:64px;transition:transform .08s}
.row:active{transform:scale(.985)}
.row .chk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;transition:background .15s}
.row .chk svg{width:16px;height:16px;opacity:0;transform:scale(.6);transition:.15s}
.row.done .chk{background:var(--c)}
.row.done .chk svg{opacity:1;transform:none}
.row .nm{flex:1;min-width:0;font-weight:600;font-size:16px;overflow-wrap:anywhere}
.row.done .nm{color:var(--muted)}
.row .meta{font-size:12px;color:var(--muted);white-space:nowrap}
.row[disabled]{cursor:default;opacity:.7}
.row[disabled]:active{transform:none}
.sub{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin:18px 2px 8px}
.sub.warn{color:var(--today)}
.row.off{background:transparent;border-style:dashed;min-height:52px;padding-block:10px}
.row.off .nm{font-size:15px;font-weight:500}
.empty{padding:22px 16px;border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted);font-size:14px}
.addline{margin-top:10px;width:100%;padding:12px;border-radius:var(--radius);border:1px dashed var(--line);color:var(--muted);font-weight:600;font-size:14px}
.note{margin-bottom:10px}
.ytrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 12px}
.ytrow label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin-right:auto}
.ytrow .iconbtn{width:34px;height:34px;border-radius:10px;font-size:16px;background:var(--ground)}
.ytrow input{width:68px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--ground);color:var(--ink);text-align:right;padding:0 8px;font:inherit;font-size:16px;font-variant-numeric:tabular-nums}
.ytrow .unit{font-size:13px;color:var(--muted)}
.ytrow .hm{font-size:12px;color:var(--muted);min-width:3.2em;text-align:right}
.ytrow input:disabled,.ytrow button:disabled{opacity:.5;cursor:default}
.ytrow .ok{display:none;margin-left:8px;color:var(--yt);letter-spacing:0}
.ytrow.done{border-color:var(--yt)}
.ytrow.done .ok{display:inline}
.moodrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 12px}
.moodrow > span:first-child{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em}
.moodrow .mtx{font-size:12px;color:var(--muted);margin-right:auto;margin-left:6px}
.moodrow.done{border-color:var(--h3)} .moodrow.done .mtx{color:var(--h3);font-weight:600}
.moods{display:flex;gap:4px}
.moods button{width:36px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--ground);font-weight:700;font-variant-numeric:tabular-nums}
.moods button[aria-pressed="true"]{background:var(--h3);border-color:var(--h3);color:var(--surface)}
.moods button:disabled{opacity:.5;cursor:default}
.focrow.done{border-color:var(--h0)} .focrow .ok{color:var(--h0)}
.lunchrow.done{border-color:var(--h2)} .lunchrow .ok{color:var(--h2)}
.lunchrow input{width:88px}
.lunchsum{flex-basis:100%;font-size:12px;color:var(--muted)}
.lunchsum:empty{display:none}
.tg{display:inline-block;font-size:10.5px;font-weight:700;padding:0 6px;border-radius:5px;margin-left:6px;vertical-align:2px;border:1px solid var(--c);color:var(--c)}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tags span{font-size:12px;color:var(--muted);font-weight:600;margin-right:2px}
.ytsum{margin-top:8px;font-size:13px;color:var(--muted)}
/* ---- 予定表 ---- */
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;gap:2px;background:var(--sunk);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{height:32px;padding:0 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.cell .evd{display:flex;gap:3px;justify-content:center;margin-top:auto;margin-bottom:auto}
.cell .evd i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.cell .evs{display:none;width:100%;flex-direction:column;gap:2px;min-width:0}
.cell .evs span{display:block;font-size:10.5px;line-height:1.35;padding:0 4px;border-radius:4px;background:var(--sunk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.cell .evs span.more{background:transparent;color:var(--muted);padding:0 2px}
.cell .ym{font-size:12px;font-weight:700;color:var(--yt);margin-top:auto;margin-bottom:auto;position:relative}
.cell .heat{height:0}
.evrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;min-height:52px}
.evrow .tm{flex:none;width:3.4em;font-size:13px;font-weight:700;color:var(--accent)}
.evrow .tm.all{color:var(--muted);font-weight:600}
.evrow b{flex:1;min-width:0;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.field input[type=date],.field input[type=time]{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--ground);color:var(--ink);padding:0 12px;font:inherit;font-size:16px}
.frow{display:flex;gap:10px;flex-wrap:wrap}
.frow .field{flex:1;min-width:140px}
.frow .field input{width:100%}
/* ---- 立ち上げ時のお知らせ ---- */
.sheet .lead{margin:-6px 0 14px;font-size:13px;color:var(--muted)}
.sheet .list{margin-bottom:14px}
.ytsum b{color:var(--ink);font-weight:700}
.note label{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin:0 2px 6px}
.note textarea{width:100%;min-height:64px;resize:vertical;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 12px;font:inherit;font-size:15px}

/* ---- タスク ---- */
.trow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px 10px 14px;min-height:56px;--c:var(--accent)}
.trow .chk{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--c);display:grid;place-items:center;transition:background .15s}
.trow .chk svg{width:15px;height:15px;opacity:0;transform:scale(.6);transition:.15s}
.trow.done .chk{background:var(--c)}
.trow.done .chk svg{opacity:1;transform:none}
.trow .chk.ai{--c:var(--h4);margin-left:-4px}
.trow .chk.ai svg{opacity:0;transform:scale(.6)}
.trow .chk.ai.on{background:var(--c)}
.trow .chk.ai.on svg{opacity:1;transform:none}
.trow.done .chk.ai:not(.on){background:transparent}
.trow.done .chk.ai:not(.on) svg{opacity:0}
.trow .body{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:1px;padding-block:2px}
.trow .body b{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.trow.done .body b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--future)}
.trow .due{font-size:12px;color:var(--muted)}
.trow .due.over{color:var(--today);font-weight:600}
.trow .due.tod{color:var(--accent);font-weight:600}
.qadd{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:6px}
.qadd .ln{display:flex;gap:8px}
.qadd input[type=text]{flex:1;min-width:0;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--ground);color:var(--ink);padding:0 12px;font:inherit;font-size:16px}
.qadd .primary{padding:0 16px;height:44px}
.qadd .opts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.qadd .opts span{font-size:12px;color:var(--muted);font-weight:600;margin-right:2px}
input[type=date]{height:32px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 10px;font:inherit;font-size:13px}
details.donebox{margin-top:18px}
details.donebox summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin:0 2px 8px;list-style:none}
details.donebox summary::-webkit-details-marker{display:none}
details.donebox summary::before{content:"▸ "}
details.donebox[open] summary::before{content:"▾ "}
.recTasks .trow{min-height:52px}
.trow .grip{flex:none;width:28px;height:40px;margin-left:-8px;margin-right:-4px;display:grid;place-items:center;color:var(--future);cursor:grab;touch-action:none;border-radius:8px}
.trow .grip svg{width:18px;height:18px}
.trow .grip:hover{color:var(--muted)}
.trow.dragging{position:relative;z-index:3;box-shadow:0 8px 24px rgba(0,0,0,.18);border-color:var(--accent);transform:scale(1.02)}
.trow.dragging .grip{cursor:grabbing;color:var(--accent)}
body:has(.trow.dragging){user-select:none;-webkit-user-select:none}

/* ---- カレンダー ---- */
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calhead h2{margin:0;font-size:20px;flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:11px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:2px}
.dow.sun{color:var(--h6)} .dow.sat{color:var(--h1)}
.cell{aspect-ratio:1/1.12;max-width:100%;border-radius:10px;background:var(--surface);border:1px solid var(--line);padding:5px 4px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;overflow:hidden}
.cell.blank{background:transparent;border-color:transparent}
.cell .d{font-size:13px;font-weight:600;line-height:1}
.cell.today .d{color:var(--today)}
.cell.sel{outline:2px solid var(--ink);outline-offset:-1px}
.cell .heat{position:absolute;inset:auto 0 0 0;background:var(--accent);opacity:.9}
.cell .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-width:100%;position:relative}
.cell .dots i{width:7px;height:7px;border-radius:50%;background:var(--c);border:1.5px solid var(--c)}
.cell .dots i.p{background:transparent}
.cell .dots i.f{background:transparent;border-color:var(--future)}
.cell .big{width:18px;height:18px;border-radius:50%;margin-top:auto;margin-bottom:auto;border:2px solid var(--c)}
.cell .big.y{background:var(--c)}
.cell .big.f{border-color:var(--future);border-style:dashed}
.cell .nt{position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .k{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.stat .v{font-size:22px;font-weight:700;line-height:1.2}
.stat .v small{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.legend i.y{background:var(--muted)}

/* ---- 習慣 ---- */
.habrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.habrow .sw{flex:none;width:12px;height:36px;border-radius:6px;background:var(--c)}
.habrow .tx{flex:1;min-width:0}
.habrow .tx b{display:block;font-size:15px;overflow-wrap:anywhere}
.habrow .tx span{font-size:12px;color:var(--muted)}
.habrow .st{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.habrow .st b{display:block;font-size:17px;color:var(--ink)}
.primary{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:12px;padding:12px 16px}

/* ---- シート ---- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.sheet h3{margin:0 0 14px;font-size:17px}
.field{margin-bottom:16px}
.field > label,.field > .lb{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.field input[type=text]{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--ground);color:var(--ink);padding:0 12px;font:inherit;font-size:16px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid transparent;box-shadow:inset 0 0 0 2px var(--surface)}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd button{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--ground);font-weight:700}
.wd button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.presets{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.sheetact{display:flex;gap:8px;align-items:center;margin-top:6px}
.sheetact .primary{flex:1}
.danger{color:var(--h6);font-weight:600;padding:12px 10px;font-size:14px}
.danger.armed{background:var(--h6);color:#fff;border-radius:12px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}

/* ---- 分析 ---- */
.radar + .radar{margin-top:10px}
.radar{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 12px}
.rhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rhead b{font-size:15px} .rhead span{font-size:12px;color:var(--muted)}
.rhead em{font-style:normal;margin-left:auto;font-weight:700;font-size:15px}
.rbody{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
.rsvg{flex:1 1 280px;max-width:380px;margin:0 auto}
.rsvg svg{display:block;width:100%;height:auto}
.rsvg svg text{font-family:inherit;fill:var(--ink)}
.rsvg .rl{font-size:11.5px;font-weight:600}
.rsvg .rv{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.rsvg .gl{font-size:9.5px;fill:var(--muted)}
.rsvg .lg{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--muted)}
.rsvg .lg span{display:flex;align-items:center;gap:5px}
.rsvg .lg i{width:10px;height:10px;border-radius:3px;background:var(--c);opacity:.6}
.rsvg .lg .dash::before{content:"";width:16px;border-top:1.5px dashed var(--muted)}
.rlist{flex:1 1 260px;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rlist li{display:grid;grid-template-columns:auto 1fr auto 3.2em;gap:0 8px;align-items:baseline}

.rlist .up{color:var(--pos)} .rlist .down{color:var(--neg)} .rlist .flat{color:var(--muted)}

.evals{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ev .hd{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.ev .hd i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.ev .hd span{font-weight:600;letter-spacing:0;margin-left:auto;text-align:right}
.ev .big{font-size:30px;font-weight:700;line-height:1.1}
.ev .big small{font-size:13px;font-weight:600;color:var(--muted);margin-left:4px}
.ev .cmp{font-size:12px;font-weight:600}
.ev .cmp.up{color:var(--pos)} .ev .cmp.down{color:var(--neg)} .ev .cmp.flat{color:var(--muted)}
.ev dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.ev dt{color:var(--muted)} .ev dd{margin:0;text-align:right;font-weight:600}
.chartbox{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 12px 6px;margin-top:10px}
.chartbox .lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
.chartbox .lg span{display:flex;align-items:center;gap:5px}
.chartbox .lg i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.chartbox svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chartbox svg text{font-size:10.5px;fill:var(--muted);font-family:inherit}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--ground);font-size:12px;line-height:1.45;padding:6px 9px;border-radius:8px;white-space:nowrap;z-index:2}
.tip b{font-weight:700}
.insight{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:10px}
.insight b{font-weight:700}
.cor{display:flex;flex-direction:column;gap:8px}
.crow{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.crow .nm{font-weight:600;font-size:15px;display:flex;align-items:center;gap:7px;min-width:0;overflow-wrap:anywhere}
.crow .nm i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c)}
.crow .df{font-size:13px;font-weight:700;text-align:right}
.crow .df.up{color:var(--pos)} .crow .df.down{color:var(--neg)} .crow .df.flat{color:var(--muted)}
.crow .bars{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr 3.6em;gap:4px 8px;align-items:center;font-size:12px}
.crow .bars span{color:var(--muted);white-space:nowrap}
.crow .bars em{font-style:normal;text-align:right;font-weight:600}
.crow .trk{height:10px;border-radius:0 4px 4px 0;background:transparent}
.crow .trk b{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--c);min-width:2px}
.crow .trk.no b{background:var(--future)}
.crow .few{grid-column:1/-1;font-size:11.5px;color:var(--muted)}
.crow.weak{opacity:.72}

/* ---- タブバー ---- */
nav.tabs{flex:none;order:2;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--today);color:#fff;font-size:10px;line-height:17px;text-align:center}

@media (min-width:900px){
  .app{padding-block:18px 40px}
  .cols{grid-template-columns:minmax(340px,400px) 1fr;gap:32px;align-items:start}
  #rec{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
  nav.tabs{position:static;display:flex;gap:4px;background:var(--sunk);border:0;border-radius:12px;padding:4px;width:max-content}
  nav.tabs button{height:34px;flex-direction:row;padding:0 14px;border-radius:9px;font-size:13px;gap:6px}

  #cal.plan .cell .d{align-self:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
(function(){
"use strict";
var COLORS=["h0","h1","h2","h3","h4","h5","h6","h7"];
var WD=["日","月","火","水","木","金","土"];
var CACHE="narawashi-v1";
var $=function(id){return document.getElementById(id)};

/* ---------- 日付 ---------- */
function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(k,n){var d=parse(k);d.setDate(d.getDate()+n);return key(d)}
function todayKey(){return key(new Date())}

/* ---------- 状態 ---------- */
var S={habits:{},logs:{},tasks:{}};
try{var c=JSON.parse(localStorage.getItem(CACHE)||"null");if(c&&c.habits)S=c;}catch(e){}
S.tasks=S.tasks||{};S.events=S.events||{};
var V={view:"rec",day:todayKey(),mon:todayKey().slice(0,7),filter:"all",calMode:"hab"};
/* YouTube の記録を達成率に数え始める日（機能を入れた日） */
var YT_START="2026-09-24";
function ytPlanned(k){return k>=YT_START}
var h0=(location.hash||"").slice(1);if(h0==="cal"||h0==="hab"||h0==="task"||h0==="goal"||h0==="ana")V.view=h0;
var db=null,dbReady=false,dirty={},timers={},chains={};

function saveLocal(){try{localStorage.setItem(CACHE,JSON.stringify(S))}catch(e){}}
function habitList(all){return Object.keys(S.habits).map(function(id){var h=S.habits[id];return Object.assign({id:id},h)}).filter(function(h){return all||!h.archived}).sort(function(a,b){return (a.order||0)-(b.order||0)||String(a.start).localeCompare(String(b.start))})}
function month(k){return S.logs[k.slice(0,7)]||{done:{},notes:{}}}
function doneOn(k){return (month(k).done||{})[k]||[]}
function isDone(k,id){return doneOn(k).indexOf(id)>=0}
function planned(h,k){return !!(h.days&&h.days[parse(k).getDay()])&&(!h.start||k>=h.start)}

function streak(h){
  var t=todayKey(),k=t,n=0,guard=0;
  if(planned(h,k)&&!isDone(k,h.id))k=addDays(k,-1);
  while(guard++<800){
    if(h.start&&k<h.start)break;
    if(planned(h,k)){if(isDone(k,h.id))n++;else break;}
    else if(isDone(k,h.id))n++;
    k=addDays(k,-1);
  }
  return n;
}

/* ---------- 書き込み ---------- */
function writeMonth(m){
  dirty[m]=true;saveLocal();
  if(!db)return;
  clearTimeout(timers[m]);
  timers[m]=setTimeout(function(){
    chains[m]=(chains[m]||Promise.resolve()).then(function(){
      var body=JSON.parse(JSON.stringify(S.logs[m]||{done:{},notes:{}}));
      return db.doc("logs/"+m).set(body);
    }).then(function(){dirty[m]=false;setSync()},function(){setSync(true)});
  },350);
}
function writeHabit(id){
  saveLocal();
  if(!db)return;
  var h=S.habits[id];
  var p=h?db.doc("habits/"+id).set(JSON.parse(JSON.stringify(h))):db.doc("habits/"+id).delete();
  p.catch(function(){setSync(true)});
}
function writeTask(id){
  saveLocal();
  if(!db)return;
  var t=S.tasks[id];
  var p=t?db.doc("tasks/"+id).set(JSON.parse(JSON.stringify(t))):db.doc("tasks/"+id).delete();
  p.catch(function(){setSync(true)});
}
function writeEvent(id){
  saveLocal();
  if(!db)return;
  var ev=S.events[id];
  var p=ev?db.doc("events/"+id).set(JSON.parse(JSON.stringify(ev))):db.doc("events/"+id).delete();
  p.catch(function(){setSync(true)});
}
function toggleDone(k,id){
  var m=k.slice(0,7);
  var L=S.logs[m]=S.logs[m]||{done:{},notes:{}};L.done=L.done||{};
  var arr=(L.done[k]||[]).slice(),i=arr.indexOf(id);
  if(i>=0)arr.splice(i,1);else arr.push(id);
  if(arr.length)L.done[k]=arr;else delete L.done[k];
  writeMonth(m);
}

/* ---------- 記録画面 ---------- */
var CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="var(--surface)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function renderRec(){
  var k=V.day,t=todayKey(),d=parse(k),future=k>t;
  $("dayTitle").innerHTML=(d.getMonth()+1)+"月"+d.getDate()+"日<small>("+WD[d.getDay()]+")</small>";
  var diff=Math.round((parse(k)-parse(t))/864e5);
  var rel=diff===0?"今日":diff===-1?"昨日":diff===1?"明日":diff<0?(-diff)+"日前":diff+"日後";
  $("dayRel").textContent=rel;
  $("dayRel").className="rel"+(diff===0?" is-today":"");
  $("todayBtn").hidden=diff===0;

  var hs=habitList(),on=[],off=[];
  hs.forEach(function(h){(planned(h,k)?on:off).push(h)});
  var dn=on.filter(function(h){return isDone(k,h.id)}).length;
  var extra=off.filter(function(h){return isDone(k,h.id)}).length;
  /* YouTube の記録も1項目として数える */
  var tot=on.length;
  if(ytPlanned(k)){tot++;if(ytOn(k)!==null)dn++}
  var pct=tot?Math.round(dn/tot*100):0;
  $("progress").innerHTML=tot?'<b class="num">'+dn+" / "+tot+'</b><div class="bar"><span style="width:'+pct+'%"></span></div><span class="num" style="font-size:12px;color:var(--muted)">'+(extra?"予定外 +"+extra:pct+"%")+"</span>":"";

  /* まだ記録していない項目を上に、済んだ項目を下に */
  function undoneFirst(a,b){return isDone(k,a.id)-isDone(k,b.id)}
  on.sort(undoneFirst);off.sort(undoneFirst);

  var html="";
  if(hs.length){
    html+='<div class="list">'+on.map(function(h){return rowHtml(h,k,future,false)}).join("")+"</div>";
    if(off.length)html+='<div class="sub">予定外</div><div class="list">'+off.map(function(h){return rowHtml(h,k,future,true)}).join("")+"</div>";
  }
  $("recList").innerHTML=html;
  renderRecEvents();
  renderRecTasks();
  $("noteLabel").textContent=(d.getMonth()+1)+"月"+d.getDate()+"日（"+WD[d.getDay()]+"）のメモ";
  var nb=$("noteBox");
  /* 日付を切り替えたら、入力中でもその日のメモに差し替える */
  if(document.activeElement!==nb||nb.dataset.k!==k){nb.value=(month(k).notes||{})[k]||"";nb.dataset.k=k}
  renderYt();
  renderMood();
  renderFocus();
  renderLunch();
}

/* ---------- YouTube 視聴時間（分・日ごと） ---------- */
function ytOn(k){var v=(month(k).yt||{})[k];return typeof v==="number"?v:null}
function hm(n){return Math.floor(n/60)+":"+String(n%60).padStart(2,"0")}
function renderYt(){

function dueLabel(due){
  if(!due)return {t:"",c:""};
  var t=todayKey(),diff=Math.round((parse(due)-parse(t))/864e5),d=parse(due);
  var md=(d.getMonth()+1)+"/"+d.getDate()+"("+WD[d.getDay()]+")";
  if(diff<0)return {t:md+" ・ "+(-diff)+"日超過",c:"over"};
  if(diff===0)return {t:"今日まで",c:"tod"};
  if(diff===1)return {t:"明日まで",c:""};
  return {t:md+"まで",c:""};
}

function byDue(a,b){return String(a.due).localeCompare(String(b.due))||(a.created||0)-(b.created||0)}
function openTasks(){return taskList().filter(function(t){return !t.done})}
V.tf="all";
function tfOk(x){return V.tf==="all"||(V.tf==="work")===!!x.work}
$("taskFilter").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;V.tf=b.dataset.f;renderTask()});
function renderTask(){
  [].forEach.call($("taskFilter").querySelectorAll("button"),function(b){b.setAttribute("aria-pressed",b.dataset.f===V.tf)});
  var t=todayKey(),open=openTasks().filter(tfOk);
  var over=open.filter(function(x){return x.due&&x.due<t}).sort(byOrd);
  var tod=open.filter(function(x){return x.due===t}).sort(byOrd);
  var next=open.filter(function(x){return x.due&&x.due>t}).sort(byOrd);
  var none=open.filter(function(x){return !x.due}).sort(byOrd);
  var done=taskList().filter(function(x){return x.done&&tfOk(x)}).sort(function(a,b){return String(b.doneAt).localeCompare(String(a.doneAt))||(b.created||0)-(a.created||0)});
  function grp(label,arr,cls,g){return arr.length?'<div class="sub'+(cls?" "+cls:"")+'">'+label+" <span class=\"num\">"+arr.length+'</span></div><div class="list" data-g="'+g+'">'+arr.map(function(x){return taskRow(x,true)}).join("")+"</div>":""}
  var html=grp("期限切れ",over,"warn","over")+grp("今日",tod,"","tod")+grp("これから",next,"","next")+grp("期限なし",none,"","none");
  if(!open.length)html+='<div class="empty" style="margin-top:14px">'+(V.tf==="all"?"未完了のタスクはありません。上の欄から追加できます。":"この分類の未完了タスクはありません。")+'</div>';
  if(done.length)html+='<details class="donebox" id="doneBox"'+(V.doneOpen?" open":"")+'><summary>完了済み <span class="num">'+done.length+'</span></summary><div class="list">'+done.slice(0,50).map(taskRow).join("")+"</div></details>";
  $("taskList").innerHTML=html;
  var db2=$("doneBox");if(db2)db2.addEventListener("toggle",function(){V.doneOpen=db2.open});
}

/* ---------- タスクの並び替え（ドラッグ＆ドロップ） ---------- */
/* 手で並べた順（ord）を優先し、まだ並べていないタスクは期限順で後ろに付ける */
function byOrd(a,b){
  var ha=typeof a.ord==="number",hb=typeof b.ord==="number";
  if(ha&&hb)return a.ord-b.ord||byDue(a,b);
  if(ha!==hb)return ha?-1:1;
  return byDue(a,b);
}
function grpKey(x,t){return !x.due?"none":x.due<t?"over":x.due===t?"tod":"next"}
/* 表示中の並び（絞り込み中は見えている分だけ）を、グループ全体の順番に反映して保存する */
function saveOrder(g,ids){
  var t=todayKey();
  var full=openTasks().filter(function(x){return grpKey(x,t)===g}).sort(byOrd);
  var shown={};ids.forEach(function(id){shown[id]=1});
  var q=ids.slice(),out=full.map(function(x){return shown[x.id]?q.shift():x.id});
  out.forEach(function(id,i){var x=S.tasks[id];if(x&&x.ord!==i){x.ord=i;writeTask(id)}});
  render();
}
(function(){
  var drag=null,sc=$("scroller"),raf=0;
  function rowsOf(list){return [].slice.call(list.querySelectorAll(".trow"))}
  function place(y){
    var list=drag.list,rows=rowsOf(list).filter(function(r){return r!==drag.row}),before=null;
    for(var i=0;i<rows.length;i++){var b=rows[i].getBoundingClientRect();if(y<b.top+b.height/2){before=rows[i];break}}
    if(before!==drag.row.nextSibling||(!before&&list.lastElementChild!==drag.row))list.insertBefore(drag.row,before);
  }
  function autoScroll(){
    if(!drag)return;
    var b=sc.getBoundingClientRect(),y=drag.y,d=0;
    if(y<b.top+60)d=-8;else if(y>b.bottom-60)d=8;
    if(d){sc.scrollTop+=d;place(y)}
    raf=requestAnimationFrame(autoScroll);
  }
  $("taskList").addEventListener("pointerdown",function(e){
    var g=e.target.closest(".grip");if(!g)return;
    var row=g.closest(".trow"),list=row.parentNode;
    e.preventDefault();
    drag={row:row,list:list,y:e.clientY,start:rowsOf(list).map(function(r){return r.dataset.t}).join(),id:e.pointerId};
    try{g.setPointerCapture(e.pointerId)}catch(_){}
    row.classList.add("dragging");
    raf=requestAnimationFrame(autoScroll);
  });
  $("taskList").addEventListener("pointermove",function(e){if(!drag||e.pointerId!==drag.id)return;e.preventDefault();drag.y=e.clientY;place(e.clientY)});
  function end(e){
    if(!drag||e.pointerId!==drag.id)return;
    cancelAnimationFrame(raf);
    var d=drag;drag=null;d.row.classList.remove("dragging");
    var ids=rowsOf(d.list).map(function(r){return r.dataset.t});
    if(ids.join()!==d.start)saveOrder(d.list.dataset.g,ids);
  }
  $("taskList").addEventListener("pointerup",end);
  $("taskList").addEventListener("pointercancel",end);
  /* キーボード：つまみにフォーカスして ↑↓ で1つずつ動かす */
  $("taskList").addEventListener("keydown",function(e){
    var g=e.target.closest(".grip");if(!g||(e.key!=="ArrowUp"&&e.key!=="ArrowDown"))return;
    e.preventDefault();
    var row=g.closest(".trow"),list=row.parentNode,id=row.dataset.t;
    var sib=e.key==="ArrowUp"?row.previousElementSibling:row.nextElementSibling;if(!sib)return;
    list.insertBefore(row,e.key==="ArrowUp"?sib:sib.nextSibling);
    saveOrder(list.dataset.g,rowsOf(list).map(function(r){return r.dataset.t}));
    var ng=document.querySelector('.trow[data-t="'+id+'"] .grip');if(ng)ng.focus();
  });
})();

function openTaskSheet(id){
  var x=S.tasks[id];if(!x)return;
  var root=$("sheetRoot"),due=x.due||"",tg={work:!!x.work,goal:!!x.goal,imp:!!x.imp};
  root.innerHTML='<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">'+
    '<h3 id="shT">タスクを編集</h3>'+
    '<div class="field"><label for="tName">タスク名</label><input type="text" id="tName" maxlength="80" value="'+esc(x.title)+'"></div>'+
    '<div class="field"><span class="lb">期限</span><div class="presets" id="tPre"><button class="pill" data-q="none">なし</button><button class="pill" data-q="0">今日</button><button class="pill" data-q="1">明日</button><input type="date" id="tDate" aria-label="期限の日付"></div></div>'+
    '<div class="field"><span class="lb">印</span><div class="presets" id="tTags"><button class="pill" data-g="work">仕事</button><button class="pill" data-g="goal">目標に関係あり</button><button class="pill" data-g="imp">重要</button></div></div>'+
    '<div class="sheetact"><button class="danger" id="tDel">削除</button><button class="pill" id="tCancel" style="height:46px">閉じる</button><button class="primary" id="tSave">保存</button></div>'+
    "</div></div>";
  function paint(){
    var t=todayKey();
    [].forEach.call(root.querySelectorAll("#tPre .pill"),function(b){b.setAttribute("aria-pressed",(b.dataset.q==="none"?"":addDays(t,+b.dataset.q))===due)});
    $("tDate").value=due;
    [].forEach.call(root.querySelectorAll("#tTags .pill"),function(b){b.setAttribute("aria-pressed",!!tg[b.dataset.g])});
  }
  $("tTags").onclick=function(e){var b=e.target.closest(".pill");if(!b)return;tg[b.dataset.g]=!tg[b.dataset.g];paint()};
  paint();
  $("tPre").onclick=function(e){var b=e.target.closest(".pill");if(!b)return;due=b.dataset.q==="none"?"":addDays(todayKey(),+b.dataset.q);paint()};
  $("tDate").onchange=function(){due=this.value||"";paint()};
  function close(){root.innerHTML=""}
  $("tCancel").onclick=close;
  $("scrim").onclick=function(e){if(e.target.id==="scrim")close()};
  function save(){
    var n=$("tName").value.trim();if(!n){$("tName").focus();return}
    var old=S.tasks[id],post=(old.post||[]).slice();
    /* 期限を後ろにずらした・外したら「先延ばし」として日付を残す */
    if(!old.done&&old.due&&(!due||due>old.due))post.push(todayKey());
    S.tasks[id]=Object.assign({},old,{title:n,due:due,work:tg.work,goal:tg.goal,imp:tg.imp,post:post});

    if((old.due||"")!==due)delete S.tasks[id].ord;
    writeTask(id);close();render();

/* ---------- 目的達成に近づく7つの指標（直近7日・0〜100点） ---------- */
function focusOn(k){var v=(month(k).focus||{})[k];return typeof v==="number"?v:null}
function sevenScores(days){
  var t=todayKey(),set={};days.forEach(function(k){set[k]=1});
  function cap(v){return v===null?null:Math.max(0,Math.min(100,Math.round(v)))}
  var all=taskList();
  /* ① 立て直し力：休んだ次の予定日に再開できたか */
  var miss=0,rec=0,pl=0;
  habitList().forEach(function(h){
    days.forEach(function(k){
      if(k>=t||!planned(h,k))return;pl++;
      if(isDone(k,h.id))return;
      var n=addDays(k,1),g=0;while(g++<14&&!planned(h,n))n=addDays(n,1);
      if(g>14||n>t)return;
      if(n===t&&!isDone(n,h.id))return;
      miss++;if(isDone(n,h.id))rec++;
    });
  });
  var s1=miss?rec/miss*100:(pl?100:null),b1=miss?"休んだ "+miss+"回のうち次の予定日に再開 "+rec+"回":(pl?"休んだ日なし":"習慣の予定なし");
  /* ② 振り返り率：メモを書いた日 */
  var nd=days.filter(function(k){return (month(k).notes||{})[k]}).length;
  /* ③ 目的への集中度：完了したうち「目標」の印つき */
  var done=all.filter(function(x){return x.done&&set[x.doneAt]}),goal=done.filter(function(x){return x.goal}).length;
  /* ④ 優先順位の実行力：「重要」の印つきを期限内に完了 */
  var imp=all.filter(function(x){return x.imp&&x.due&&set[x.due]&&(x.due<t||x.done)}),impOk=imp.filter(function(x){return x.done&&x.doneAt<=x.due}).length;
  /* ⑤ 先延ばしの少なさ：期限をずらした・期限切れのまま */
  var T=all.filter(function(x){return (x.due&&set[x.due]&&x.due<=t)||(x.post||[]).some(function(k){return set[k]})});
  var post=sum(all.map(function(x){return (x.post||[]).filter(function(k){return set[k]}).length}));
  var bad=T.filter(function(x){return (x.post||[]).some(function(k){return set[k]})||(!x.done&&x.due&&x.due<t)}).length;
  var overs=all.filter(function(x){return !x.done&&x.due&&x.due<t}).map(function(x){return Math.round((parse(t)-parse(x.due))/864e5)});
  /* ⑥ 計画の見積もり精度：その日が期限のタスクを、その日のうちに全部終えた日 */
  var dd=0,dok=0;
  days.forEach(function(k){
    if(k>=t)return;var ts=all.filter(function(x){return x.due===k});if(!ts.length)return;
    dd++;if(ts.every(function(x){return x.done&&x.doneAt<=k}))dok++;
  });
  /* ⑦ 集中時間：集中 ÷（集中＋YouTube） */
  var F=0,Y=0,fn=0;days.forEach(function(k){var f=focusOn(k),y=ytOn(k);if(f!==null){F+=f;fn++}if(y!==null)Y+=y});
  return [
    {k:"立て直し力",l:["立て直し力"],col:"h1",v:cap(s1),b:b1},
    {k:"振り返り率",l:["振り返り率"],col:"h7",v:cap(nd/days.length*100),b:"メモを書いた日 "+nd+" / "+days.length+"日"},
    {k:"目的への集中度",l:["目的への","集中度"],col:"h2",v:cap(done.length?goal/done.length*100:null),b:done.length?"完了 "+done.length+"件のうち「目標」 "+goal+"件":"完了したタスクなし"},
    {k:"優先順位の実行力",l:["優先順位の","実行力"],col:"h6",v:cap(imp.length?impOk/imp.length*100:null),b:imp.length?"「重要」を期限内に完了 "+impOk+" / "+imp.length+"件":"期限が来た「重要」タスクなし"},
    {k:"先延ばしの少なさ",l:["先延ばしの","少なさ"],col:"h5",v:cap(T.length?(T.length-bad)/T.length*100:null),b:T.length?"期限をずらした "+post+"回・期限切れの平均超過 "+(overs.length?fmt1(sum(overs)/overs.length):"0")+"日（"+(T.length-bad)+" / "+T.length+"件が期限どおり）":"期限が来たタスクなし"},
    {k:"計画の見積もり精度",l:["見積もり","精度"],col:"h4",v:cap(dd?dok/dd*100:null),b:dd?"期限のタスクをその日に全部終えた日 "+dok+" / "+dd+"日":"期限つきタスクのある日なし"},
    {k:"集中時間",l:["集中時間"],col:"h0",v:cap(fn&&F+Y?F/(F+Y)*100:null),b:fn?"集中 "+hm(F)+" ／ YouTube "+hm(Y)+"（集中の割合）":"集中時間が未記録"}
  ];
}
/* ---------- 5つの力の五角形（直近7日・0〜100点） ---------- */
var EVN=7;
function fiveScores(days){
  var c=taskStats(days),q=planStats(days);
  function cap(v){return v===null?null:Math.max(0,Math.min(100,Math.round(v)))}
  return [
    {k:"問題意識",l:["問題意識"],col:"aw",v:cap(c.addDays/EVN*100),b:"タスクを追加した日 "+c.addDays+" / "+EVN+"日"},
    {k:"タスク遂行力",l:["タスク","遂行力"],col:"ex",v:cap(c.added?c.done/c.added*100:(c.done?100:null)),b:"完了 "+c.done+"件 ÷ 追加 "+c.added+"件（上限100）"},
    {k:"スケジュール通りの遂行力",l:["スケジュール","通りの遂行力"],col:"h0",v:cap(q.P+q.due?(q.D+q.onTime)/(q.P+q.due)*100:null),b:"予定・期限どおり "+(q.D+q.onTime)+" / "+(q.P+q.due)+"件"},
    {k:"メンタルコントロール力",l:["メンタル","コントロール力"],col:"h3",v:cap(q.mAvg===null?null:(q.mAvg-1)/4*100),b:q.mAvg===null?"気分が未記録":"気分の平均 "+fmt1(q.mAvg)+" / 5（"+q.moodN+"日分）"},
    {k:"スケジュール設定力",l:["スケジュール","設定力"],col:"h4",v:cap(q.added?q.withDue/q.added*100:null),b:"期限つきで追加 "+q.withDue+" / "+q.added+"件"}
  ];
}
function renderRadar(el,title,cur,prev){
  var W=380,H=300,cx=190,cy=160,R=88,N=cur.length;
  function pt(i,r){var a=-Math.PI/2+i*2*Math.PI/N;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]}
  function poly(vals){return vals.map(function(v,i){var p=pt(i,(v||0)/100*R);return p[0].toFixed(1)+","+p[1].toFixed(1)}).join(" ")}
  var s='<svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="'+title+'（0〜100点）">';
  [25,50,75,100].forEach(function(g){s+='<polygon points="'+poly(cur.map(function(){return g}))+'" fill="none" stroke="var(--line)" stroke-width="1"'+(g<100?' stroke-dasharray="2 3"':"")+"/>"});
  for(var i=0;i<N;i++){var e=pt(i,R);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0]+'" y2="'+e[1]+'" stroke="var(--line)" stroke-width="1"/>'}
  s+='<text x="'+(cx+3)+'" y="'+(cy-R/2+11)+'" class="gl">50</text><text x="'+(cx+3)+'" y="'+(cy-R+11)+'" class="gl">100</text>';
  if(prev.some(function(x){return x.v!==null}))s+='<polygon points="'+poly(prev.map(function(x){return x.v}))+'" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/>';
  s+='<polygon points="'+poly(cur.map(function(x){return x.v}))+'" fill="var(--accent)" fill-opacity=".18" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>';
  cur.forEach(function(x,i){if(x.v===null)return;var p=pt(i,x.v/100*R);s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>'});
  cur.forEach(function(x,i){
    var p=pt(i,R+16),dx=p[0]-cx,anc=Math.abs(dx)<8?"middle":dx>0?"start":"end";
    var y0=i===0?p[1]-34:(p[1]>cy+20?p[1]+2:p[1]-8);
    s+='<text x="'+p[0]+'" y="'+y0+'" text-anchor="'+anc+'" class="rl">'+x.l.map(function(t,j){return '<tspan x="'+p[0]+'" dy="'+(j?13:0)+'">'+t+"</tspan>"}).join("")+
      '<tspan x="'+p[0]+'" dy="16" class="rv">'+(x.v===null?"–":x.v)+"</tspan></text>";
  });
  s+="</svg>";
  var rows=cur.map(function(x,i){
    var pv=prev[i].v,d=(x.v===null||pv===null)?"":'<span class="num '+(x.v>pv?"up":x.v<pv?"down":"flat")+'">'+(x.v>pv?"+":x.v<pv?"−":"±")+Math.abs(x.v-pv)+"</span>";
    return '<li style="--c:var(--'+x.col+')"><i></i><b>'+x.k+'</b><em class="num">'+(x.v===null?"–":x.v)+"</em>"+d+"<small>"+x.b+"</small></li>";
  }).join("");
  var have=cur.filter(function(x){return x.v!==null});
  var tot=have.length?Math.round(sum(have.map(function(x){return x.v}))/have.length):null;
  $(el).innerHTML='<div class="rhead"><b>'+title+'</b><span class="num">'+shortMd(addDays(todayKey(),-6))+"〜"+shortMd(todayKey())+"</span><em class=\"num\">平均 "+(tot===null?"–":tot)+"点</em></div>"+
    '<div class="rbody"><div class="rsvg">'+s+'<div class="lg"><span style="--c:var(--accent)"><i></i>直近7日</span><span class="dash">前の7日</span></div></div><ul class="rlist">'+rows+"</ul></div>";
}
/* ---------- 分析：3つの力（スケジュール設定・メンタル・予定どおり） ---------- */
function planStats(days){
  var t=todayKey(),set={};days.forEach(function(k){set[k]=1});
  var all=taskList();
  var added=all.filter(function(x){return x.created&&set[key(new Date(x.created))]});
  var withDue=added.filter(function(x){return x.due});
  var evDays=days.filter(function(k){return eventsOn(k).length}).length;
  /* 期限がこの期間に来たタスク（期限が過ぎたもの・完了したもの） */
  var due=all.filter(function(x){return x.due&&set[x.due]&&(x.due<t||x.done)});
  var onTime=due.filter(function(x){return x.done&&x.doneAt<=x.due});
  /* 習慣：今日より前の予定日 */
  var P=0,D=0,X=0;
  days.forEach(function(k){if(k>=t)return;habitList().forEach(function(h){var pl=planned(h,k),dn=isDone(k,h.id);if(pl){P++;if(dn)D++}else if(dn&&(!h.start||k>=h.start))X++})});
  var moods=days.map(moodOn).filter(function(v){return v!==null});
  var mAvg=moods.length?sum(moods)/moods.length:null;
  var mSd=moods.length>1?Math.sqrt(sum(moods.map(function(v){return (v-mAvg)*(v-mAvg)}))/moods.length):null;
  var low=moods.filter(function(v){return v<=2}).length;
  var yts=days.filter(function(k){return k<t}).map(ytOn).filter(function(v){return v!==null});
  var ytIn=yts.filter(function(v){return v<60}).length;
  return {added:added.length,withDue:withDue.length,evDays:evDays,due:due.length,onTime:onTime.length,P:P,D:D,X:X,
    moodN:moods.length,mAvg:mAvg,mSd:mSd,low:low,ytN:yts.length,ytIn:ytIn};
}
function ratio(a,b){return b?Math.round(a/b*100):null}
function cmpPt(cur,prev){
  if(cur===null||prev===null)return '<div class="cmp flat">前の'+EVN+"日と比べる記録がありません</div>";
  var d=cur-prev;return '<div class="cmp num '+(d>0?"up":d<0?"down":"flat")+'">前の'+EVN+"日より "+(d>0?"+":d<0?"−":"±")+Math.abs(d)+"ポイント（前 "+prev+"%）</div>";
}
function sm(a,b){return '<small style="color:var(--muted);font-weight:500">（'+a+"/"+b+"）</small>"}
function threeCards(days,prev){
  var c=planStats(days),p=planStats(prev);
  var setR=ratio(c.withDue,c.added),setP=ratio(p.withDue,p.added);
  var adh=ratio(c.D+c.onTime,c.P+c.due),adhP=ratio(p.D+p.onTime,p.P+p.due);
  function big(v,unit){return '<div class="big num">'+(v===null?"–":v)+'<small>'+unit+"</small></div>"}
  return ''+
  '<div class="ev" style="--c:var(--h4)"><div class="hd"><i></i>スケジュール設定力<span>期限つきで追加した割合</span></div>'+
    big(setR,"%")+cmpPt(setR,setP)+
    '<dl class="num"><dt>期限つきで追加</dt><dd>'+c.withDue+"件"+sm(c.withDue,c.added)+'</dd><dt>予定表に予定を入れた日</dt><dd>'+c.evDays+" / "+EVN+"日</dd></dl></div>"+
  '<div class="ev" style="--c:var(--h0)"><div class="hd"><i></i>スケジュール通りの遂行力<span>予定・期限どおりの割合</span></div>'+
    big(adh,"%")+cmpPt(adh,adhP)+
    '<dl class="num"><dt>習慣を予定の曜日に実行</dt><dd>'+(c.P?ratio(c.D,c.P)+"%":"–")+sm(c.D,c.P)+'</dd><dt>タスクを期限内に完了</dt><dd>'+(c.due?ratio(c.onTime,c.due)+"%":"–")+sm(c.onTime,c.due)+'</dd><dt>予定外の日にも実行</dt><dd>'+c.X+"回</dd></dl></div>"+
  '<div class="ev" style="--c:var(--h3)"><div class="hd"><i></i>メンタルコントロール力<span>気分の記録から</span></div>'+
    (c.mAvg===null?'<div class="big num">–<small>気分が未記録</small></div><div class="cmp flat">記録画面の「気分」を1〜5で付けると出ます</div>':
    '<div class="big num">'+fmt1(c.mAvg)+'<small>/ 5（'+MOOD[Math.round(c.mAvg)]+'）</small></div>'+(p.mAvg===null?'<div class="cmp flat">前の'+EVN+'日と比べる記録がありません</div>':(function(d){d=Math.round(d*10)/10;return '<div class="cmp num '+(d>0?"up":d<0?"down":"flat")+'">前の'+EVN+"日より "+(d>0?"+":d<0?"−":"±")+Math.abs(d).toFixed(1)+"（前 "+fmt1(p.mAvg)+"）</div>"})(c.mAvg-p.mAvg)))+
    '<dl class="num"><dt>気分を記録した日</dt><dd>'+c.moodN+" / "+EVN+'日</dd><dt>落ち込んだ日（1〜2）</dt><dd>'+c.low+'日</dd><dt>気分の波（ばらつき）</dt><dd>'+(c.mSd===null?"–":fmt1(c.mSd))+'</dd><dt>YouTube 60分未満の日</dt><dd>'+(c.ytN?ratio(c.ytIn,c.ytN)+"%":"–")+sm(c.ytIn,c.ytN)+"</dd></dl></div>";
}
V.per=7;V.out="done";
function addedOn(k){return taskList().filter(function(x){return x.created&&key(new Date(x.created))===k}).length}
function doneOnDay(k){return taskList().filter(function(x){return x.done&&x.doneAt===k}).length}
function daysBack(end,n){var a=[];for(var i=n-1;i>=0;i--)a.push(addDays(end,-i));return a}
function sum(a){return a.reduce(function(s,x){return s+x},0)}
function fmt1(x){return (Math.round(x*10)/10).toFixed(1)}
function cmpHtml(cur,prev,unit){
  var d=cur-prev;
  return '<div class="cmp num '+(d>0?"up":d<0?"down":"flat")+'">前の'+EVN+"日より "+(d>0?"+":d<0?"−":"±")+Math.abs(d)+unit+"（前 "+prev+unit+"）</div>";
}
function taskStats(days){
  var set={};days.forEach(function(k){set[k]=1});
  var all=taskList();
  var added=all.filter(function(x){return x.created&&set[key(new Date(x.created))]});
  var done=all.filter(function(x){return x.done&&set[x.doneAt]});
  var addedDone=added.filter(function(x){return x.done});
  var withDue=done.filter(function(x){return x.due});
  var inTime=withDue.filter(function(x){return x.doneAt<=x.due});
  var addDays_=days.filter(function(k){return added.some(function(x){return key(new Date(x.created))===k})}).length;
  return {added:added.length,done:done.length,addedDone:addedDone.length,withDue:withDue.length,inTime:inTime.length,addDays:addDays_};
}
function renderAna(){
  var t=todayKey(),n=EVN,days=daysBack(t,n),prev=daysBack(addDays(t,-n),n);
  [].forEach.call($("anaSeg").querySelectorAll("button"),function(b){b.setAttribute("aria-pressed",+b.dataset.p===V.per)});
  renderRadar("radar","直近7日の評価",fiveScores(days),fiveScores(prev));
  renderRadar("radar2","目的達成に近づく7つの指標",sevenScores(days),sevenScores(prev));
  [].forEach.call($("outSeg").querySelectorAll("button"),function(b){b.setAttribute("aria-pressed",b.dataset.o===V.out)});
  var c=taskStats(days),p=taskStats(prev),open=openTasks();
  var over=open.filter(function(x){return x.due&&x.due<t}).length;

  $("evals").innerHTML=
    '<div class="ev" style="--c:var(--aw)"><div class="hd"><i></i>問題意識<span>タスクを追加した数</span></div>'+

      '<dl class="num"><dt>1日平均</dt><dd>'+fmt1(c.added/n)+'件</dd><dt>追加した日</dt><dd>'+c.addDays+" / "+n+"日</dd></dl></div>"+
    '<div class="ev" style="--c:var(--ex)"><div class="hd"><i></i>タスク遂行力<span>タスクを完了した数</span></div>'+
      '<div class="big num">'+c.done+'<small>件 / '+n+'日</small></div>'+cmpHtml(c.done,p.done,"件")+
      '<dl class="num"><dt>この期間に追加した分の完了率</dt><dd>'+pct(c.addedDone,c.added)+'<small style="color:var(--muted);font-weight:500">（'+c.addedDone+"/"+c.added+'）</small></dd>'+
      '<dt>いま期限切れ</dt><dd'+(over?' style="color:var(--today)"':"")+'>'+over+"件</dd></dl></div>"+threeCards(days,prev);
  renderAnaChart(daysBack(t,V.per));
  renderCorr();
}

/* 日ごとの追加・完了（90日は週ごとにまとめる） */
function renderAnaChart(days){
  var groups=[];
  if(days.length>31){
    for(var i=0;i<days.length;i+=7){var g=days.slice(i,i+7);groups.push({ks:g,label:shortMd(g[0]),tip:shortMd(g[0])+"〜"+shortMd(g[g.length-1])})}
  }else days.forEach(function(k){groups.push({ks:[k],label:String(parse(k).getDate()),tip:shortDay(k)})});
  groups.forEach(function(g){g.a=sum(g.ks.map(addedOn));g.d=sum(g.ks.map(doneOnDay))});
  var W=Math.max(280,$("chart").clientWidth||600),H=170,L=26,R=6,T=8,B=22,iw=W-L-R,ih=H-T-B;
  var mx=Math.max(1,Math.max.apply(null,groups.map(function(g){return Math.max(g.a,g.d)})));
  var step=mx<=4?1:mx<=10?2:mx<=25?5:10,top=Math.ceil(mx/step)*step;
  function y(v){return T+ih-v/top*ih}
  var bw=iw/groups.length,gap=2,barW=Math.max(1.5,Math.min(14,(bw*0.7-gap)/2));
  var s='<svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="日ごとのタスク追加数と完了数">';
  for(var v=0;v<=top;v+=step){s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"'+(v?' stroke-dasharray="2 3"':"")+'/><text x="'+(L-6)+'" y="'+(y(v)+3.5)+'" text-anchor="end">'+v+"</text>"}
  var every=Math.ceil(groups.length/10);
  groups.forEach(function(g,i){
    var cx=L+bw*i+bw/2;
    function bar(val,x,col){if(!val)return "";var h=val/top*ih,r=Math.min(3,barW/2,h);return '<path d="M'+x+","+(T+ih)+"v"+(-(h-r))+"q0,"+(-r)+" "+r+","+(-r)+"h"+(barW-2*r)+"q"+r+",0 "+r+","+r+"v"+(h-r)+'z" fill="var(--'+col+')"/>'}
    s+=bar(g.a,cx-gap/2-barW,"aw")+bar(g.d,cx+gap/2,"ex");
    if(i%every===0||i===groups.length-1&&every===1)s+='<text x="'+cx+'" y="'+(H-6)+'" text-anchor="middle">'+g.label+"</text>";
  });
  s+='<rect id="hov" x="0" y="'+T+'" width="'+bw+'" height="'+ih+'" fill="var(--ink)" opacity="0" pointer-events="none"/>';
  s+="</svg>";
  $("chart").innerHTML=s;
  var svg=$("chart").firstChild,tip=$("tip"),hov=svg.querySelector("#hov");
  function show(e){
    var r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,i=Math.floor((x-L)/bw);
    if(i<0||i>=groups.length){hide();return}
    var g=groups[i];hov.setAttribute("x",L+bw*i);hov.setAttribute("opacity",".06");
    tip.innerHTML="<b>"+g.tip+'</b><br>追加 <b class="num">'+g.a+'</b>件・完了 <b class="num">'+g.d+"</b>件";
    tip.hidden=false;
    var bx=$("chartbox").getBoundingClientRect(),px=(L+bw*i+bw/2)/W*r.width+r.left-bx.left;
    tip.style.left=Math.max(4,Math.min(bx.width-tip.offsetWidth-4,px-tip.offsetWidth/2))+"px";
    tip.style.top=(r.top-bx.top-4)+"px";
  }
  function hide(){tip.hidden=true;hov.setAttribute("opacity","0")}
  svg.addEventListener("pointermove",show);svg.addEventListener("pointerdown",show);svg.addEventListener("pointerleave",hide);
}
function shortMd(k){var d=parse(k);return (d.getMonth()+1)+"/"+d.getDate()}

/* これをやった日 / やらなかった日で、結果の平均を比べる（今日は途中なので除く） */
var OUT={
  add:{label:"タスク追加",unit:"件",col:"aw",f:function(k){return addedOn(k)},dec:1},
  done:{label:"タスク完了",unit:"件",col:"ex",f:function(k){return doneOnDay(k)},dec:1},
  rate:{label:"ほかの習慣の達成率",unit:"%",col:"accent",f:null,dec:0},
  lunch:{label:"お昼ご飯代",unit:"円",col:"h2",f:function(k){return lunchOn(k)},dec:0},
  focus:{label:"集中時間",unit:"分",col:"h0",f:function(k){return focusOn(k)},dec:0},
  mood:{label:"気分",unit:"",col:"h3",f:function(k){return moodOn(k)},dec:1},
  yt:{label:"YouTube 視聴",unit:"分",col:"yt",f:function(k){return ytOn(k)},dec:0}
};
function habitRate(k,skip){
  var pl=habitList().filter(function(h){return h.id!==skip&&planned(h,k)});
  if(!pl.length)return null;
  return pl.filter(function(h){return isDone(k,h.id)}).length/pl.length*100;
}
function renderCorr(){
  var t=todayKey(),days=daysBack(addDays(t,-1),V.per),o=OUT[V.out];
  var factors=habitList().map(function(h){return {id:h.id,name:h.name+"をやった日",short:h.name,col:h.color,
    ok:function(k){return !h.start||k>=h.start},did:function(k){return isDone(k,h.id)}}});
  factors.push({id:"yt60",name:"YouTube 60分以上の日",short:"YouTube を60分以上見た日",col:"yt",ok:function(k){return ytOn(k)!==null},did:function(k){return ytOn(k)>=60}});
  if(V.out!=="add")factors.push({id:"add",name:"タスクを追加した日",short:"タスクを追加した日",col:"aw",ok:function(){return true},did:function(k){return addedOn(k)>0}});
  if(V.out==="yt")factors=factors.filter(function(f){return f.id!=="yt60"});
  var rows=[];
  factors.forEach(function(f){
    var a=[],b=[];
    days.forEach(function(k){
      if(!f.ok(k))return;
      var v=V.out==="rate"?habitRate(k,f.id):o.f(k);
      if(v===null||v===undefined)return;
      (f.did(k)?a:b).push(v);
    });
    if(!a.length&&!b.length)return;
    var ma=a.length?sum(a)/a.length:null,mb=b.length?sum(b)/b.length:null;
    rows.push({f:f,na:a.length,nb:b.length,ma:ma,mb:mb,diff:(ma!==null&&mb!==null)?ma-mb:null,weak:a.length<3||b.length<3});
  });
  rows.sort(function(x,y){return (x.weak-y.weak)||(Math.abs(y.diff||0)-Math.abs(x.diff||0))});
  var mx=Math.max.apply(null,[0.0001].concat(rows.map(function(r){return Math.max(r.ma||0,r.mb||0)})));
  function val(v){return v===null?"–":(o.dec?fmt1(v):Math.round(v))+o.unit}
  var lowGood=V.out==="yt";
  $("cor").innerHTML=rows.length?rows.map(function(r){
    var d=r.diff,cls=V.out==="lunch"?"flat":d===null||Math.abs(d)<(o.dec?0.05:0.5)?"flat":((d>0)!==lowGood?"up":"down");
    var dt=d===null?"比較できません":(d>0?"+":d<0?"−":"±")+(o.dec?fmt1(Math.abs(d)):Math.round(Math.abs(d)))+o.unit;
    return '<div class="crow'+(r.weak?" weak":"")+'" style="--c:var(--'+r.f.col+')"><div class="nm"><i></i>'+esc(r.f.name)+'</div><div class="df num '+cls+'">'+dt+"</div>"+
      '<div class="bars num" style="--c:var(--'+o.col+')"><span>やった '+r.na+'日</span><div class="trk"><b style="width:'+((r.ma||0)/mx*100)+'%"></b></div><em>'+val(r.ma)+"</em>"+
      '<span>やらない '+r.nb+'日</span><div class="trk no"><b style="width:'+((r.mb||0)/mx*100)+'%"></b></div><em>'+val(r.mb)+"</em></div>"+
      (r.weak?'<div class="few">どちらかが3日未満のため参考値です</div>':"")+"</div>";
  }).join(""):'<div class="empty">比べられる記録がまだありません。習慣やタスクを記録すると、ここに結果が出ます。</div>';
  var best=rows.filter(function(r){return !r.weak&&r.diff!==null&&Math.abs(r.diff)>=(o.dec?0.3:5)})[0];
  $("insight").innerHTML=best?'<div class="insight">'+esc(best.f.short)+(best.f.id.charAt(0)==="h"&&S.habits[best.f.id]?"をやった日":"")+"は、"+o.label+"が平均 <b class=\"num\">"+val(best.ma)+"</b>。やらなかった日は <b class=\"num\">"+val(best.mb)+"</b> です（"+best.na+"日 と "+best.nb+"日 の比較）。</div>":"";
  $("anaHint").textContent="直近"+V.per+"日（今日を除く）で比べています。同じ日に起きたことの比較で、原因とは限りません。削除したタスクは数えていません。五角形と内訳は期間の切り替えに関係なく直近7日（今日を含む）で評価し、習慣とYouTubeは今日を除いて数えています。";
}
$("anaSeg").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;V.per=+b.dataset.p;renderAna()});
$("outSeg").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;V.out=b.dataset.o;renderCorr();[].forEach.call($("outSeg").querySelectorAll("button"),function(x){x.setAttribute("aria-pressed",x.dataset.o===V.out)})});
var rzT;window.addEventListener("resize",function(){clearTimeout(rzT);rzT=setTimeout(function(){if(!$("ana").hidden)renderAna()},150)});

/* ---------- 画面切替 ---------- */
var mq=window.matchMedia("(min-width:900px)");
function wide(){return mq.matches}
function setView(v){V.view=v;try{history.replaceState(null,"",v==="rec"?location.pathname+location.search:"#"+v)}catch(e){}render();$("scroller").scrollTop=0}
$("tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(b)setView(b.dataset.v)});
function layout(){
  var w=wide(),v=V.view;
  if(w&&v==="rec")v="cal";
  $("rec").hidden=!(w||V.view==="rec");
  $("cal").hidden=!(v==="cal");
  $("hab").hidden=!(v==="hab");
  $("task").hidden=!(v==="task");
  $("ana").hidden=!(v==="ana");
  $("goal").hidden=!(v==="goal");
  var nav=$("tabs");
  if(w){if(nav.parentNode!==$("navslot"))$("navslot").appendChild(nav)}
  else if(nav.parentNode!==document.body)document.body.appendChild(nav);
  [].forEach.call(nav.querySelectorAll("button"),function(b){if(b.dataset.v===v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
}
mq.addEventListener?mq.addEventListener("change",render):mq.addListener(render);

function setSync(err){
  var el=$("sync");
  if(err){el.hidden=false;el.className="sync";el.lastChild.textContent="保存に失敗・端末に保存中";return}
  el.hidden=true;return;
}
function render(){layout();renderRec();updateBadge();if(!$("cal").hidden)renderCal();if(!$("hab").hidden)renderHab();if(!$("task").hidden)renderTask();if(!$("goal").hidden)renderGoal();if(!$("ana").hidden)renderAna()}

/* 日付が変わったら今日に追従 */
var lastToday=todayKey();
document.addEventListener("visibilitychange",function(){if(!document.hidden&&todayKey()!==lastToday){if(V.day===lastToday)V.day=todayKey();lastToday=todayKey();paintQ();render()}});

render();

/* ---------- 立ち上げ時：前回やっていない習慣 ---------- */
var SKIP="narawashi-missed-skip";
function shortDay(k){var d=parse(k);return (d.getMonth()+1)+"/"+d.getDate()+"("+WD[d.getDay()]+")"}
function missedItems(){
  var t=todayKey(),y=addDays(t,-1),out=[];
  habitList().forEach(function(h){
    /* 今日より前で、いちばん最近の「やる予定の日」を探す */
    var k=y;
    for(var i=0;i<31;i++,k=addDays(k,-1)){
      if(h.start&&k<h.start)break;
      if(planned(h,k)){if(!isDone(k,h.id))out.push({h:h,k:k});break}
    }
  });
  return out;
}
function showMissed(){
  var skip=null;try{skip=localStorage.getItem(SKIP)}catch(e){}
  if(skip===todayKey())return;
  if($("sheetRoot").innerHTML)return;
  var items=missedItems(),y=addDays(todayKey(),-1),ytMiss=ytPlanned(y)&&ytOn(y)===null;
  if(!items.length&&!ytMiss)return;
  var root=$("sheetRoot");
  function paint(){
    var rows=items.map(function(it){
      var done=isDone(it.k,it.h.id);
      return '<button class="row'+(done?" done":"")+'" data-h="'+it.h.id+'" data-k="'+it.k+'" style="--c:var(--'+(it.h.color||"h0")+')" aria-pressed="'+done+'"><span class="chk">'+CHECK+'</span><span class="nm">'+esc(it.h.name)+'</span><span class="meta num">'+shortDay(it.k)+"</span></button>";
    }).join("");
    if(ytMiss)rows+='<button class="row off" data-yt="'+y+'" style="--c:var(--yt)"><span class="chk"></span><span class="nm">YouTube 視聴時間が未記録</span><span class="meta num">'+shortDay(y)+" ›</span></button>";
    root.innerHTML='<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">'+
      '<h3 id="shT">前回できなかった習慣</h3>'+
      '<p class="lead">実はやっていた場合は、タップするとその日の分を記録できます。</p>'+
      '<div class="list" id="mList">'+rows+"</div>"+
      '<div class="sheetact"><button class="pill" id="mSkip" style="height:46px">今日はもう表示しない</button><button class="primary" id="mClose">閉じる</button></div>'+
      "</div></div>";
    $("mList").onclick=function(e){
      var b=e.target.closest(".row");if(!b)return;
      if(b.dataset.yt){close();goDay(b.dataset.yt);setView("rec");setTimeout(function(){$("ytMin").focus()},80);return}
      toggleDone(b.dataset.k,b.dataset.h);render();paint();
    };
    $("mClose").onclick=close;
    $("mSkip").onclick=function(){try{localStorage.setItem(SKIP,todayKey())}catch(e){}close()};
    $("scrim").onclick=function(e){if(e.target.id==="scrim")close()};
  }
  function close(){root.innerHTML=""}
  paint();
}
/* サーバーの最新データが届いてから一度だけ出す（届かなければ端末のデータで出す） */
var popped=false,bootH=false,bootL=false;
function maybePop(){if(popped)return;popped=true;showMissed()}
setTimeout(maybePop,6000);

/* ---------- 同期（あとから点灯） ---------- */
if(!(window.claude&&window.claude.use))maybePop();
if(window.claude&&window.claude.use){
  window.claude.use("db").then(function(d){
    if(!d){maybePop();return}
    db=d;setSync();
    var firstH=true,firstT=true,firstE=true;
    db.collection("habits").onSnapshot(function(snap){
      if(!snap.metadata.fromCache)bootH=true;
      if(firstH&&!snap.metadata.fromCache){
        firstH=false;
        if(snap.empty&&Object.keys(S.habits).length){Object.keys(S.habits).forEach(writeHabit);return}
      }
      var next={};snap.docs.forEach(function(doc){next[doc.id]=doc.data()});
      S.habits=next;dbReady=true;saveLocal();render();
      if(bootH&&bootL)maybePop();
    },function(){setSync(true)});
    db.collection("logs").onSnapshot(function(snap){
      snap.docs.forEach(function(doc){if(!dirty[doc.id])S.logs[doc.id]=JSON.parse(JSON.stringify(doc.data()))});
      saveLocal();render();
      if(!snap.metadata.fromCache){bootL=true;if(bootH)maybePop()}
    },function(){setSync(true)});
    db.collection("events").onSnapshot(function(snap){
      if(firstE&&!snap.metadata.fromCache){
        firstE=false;
        if(snap.empty&&Object.keys(S.events).length){Object.keys(S.events).forEach(writeEvent);return}
      }
      var next={};snap.docs.forEach(function(doc){next[doc.id]=JSON.parse(JSON.stringify(doc.data()))});
      S.events=next;saveLocal();render();
    },function(){setSync(true)});
    db.collection("tasks").onSnapshot(function(snap){
      if(firstT&&!snap.metadata.fromCache){
        firstT=false;
        if(snap.empty&&Object.keys(S.tasks).length){Object.keys(S.tasks).forEach(writeTask);return}
      }
      var next={};snap.docs.forEach(function(doc){next[doc.id]=JSON.parse(JSON.stringify(doc.data()))});
      S.tasks=next;saveLocal();render();
    },function(){setSync(true)});
  });
}
})();
</script>
